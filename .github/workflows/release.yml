name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # build.sh keeps the list of target platforms, bash is required for its arrays
      - name: Build
        run: bash build.sh

      # The deb packages of the binaries, versioned after the tag without the v
      - name: Package
        run: bash package.sh "${GITHUB_REF_NAME#v}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/* --generate-notes --title "$GITHUB_REF_NAME"
